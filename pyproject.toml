[project]
name = "track-money"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matheus Longhi", email = "matheuslonghiferreira@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt<5",
    "fastapi>=0.142.2",
    "passlib[bcrypt]>=1.7.4",
    "pg8000>=1.31.5",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
track-money = "track_money.app.main:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
